# TranslationPro Configuration

# Application
app.name=TranslationPro
app.version=1.0.0-SNAPSHOT
app.vendor=TranslationPro

# Database
db.type=h2
db.path=./data/translationpro
db.pool.size=10
db.cache.size=64

# Translation Memory
tm.fuzzy.threshold=70
tm.fuzzy.max.results=10
tm.context.enabled=true
tm.subsegment.enabled=true

# UI
ui.theme=modern-light
ui.font.family=Segoe UI
ui.font.size=12
ui.editor.split=horizontal
ui.auto.save=true
ui.auto.save.interval=30000

# Performance
performance.lazy.load=true
performance.segment.cache.size=1000
performance.threads=4

# Quality Assurance
qa.auto.check=true
qa.check.on.commit=true

# Machine Translation
mt.enabled=true
mt.auto.suggest=false
mt.providers=google,deepl

# Logging
logging.level=INFO
logging.file=./logs/translationpro.log
